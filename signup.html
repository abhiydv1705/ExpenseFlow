
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ExpenseFlow</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-brand">
        <div class="brand-icon">E</div>
        <span>ExpenseFlow</span>
    </div>

    <div class="auth-card">
        <div class="auth-heading">
            <p class="eyebrow">GET STARTED</p>
            <h1>Create your account</h1>
            <p>Start managing your money today.</p>
        </div>

        <form id="signup-form">
            <label>Full Name</label>
            <input type="text" id="signup-name"
                placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="signup-email"
                placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="signup-password"
                placeholder="Create a password" minlength="6" required>

            <label>Confirm Password</label>
            <input type="password" id="signup-confirm"
                placeholder="Confirm your password" required>

            <p id="signup-message" class="message"></p>

            <button type="submit" class="auth-button">
                Create Account
            </button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

    <p class="auth-footer">© 2026 ExpenseFlow. All rights reserved.</p>
</div>

<script src="auth.js"></script>
</body>
</html>
